<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f6f8ed">
	<title>마음달력 - 오늘도 너의 속도로</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #203a32;
			--muted: #75847a;
			--paper: #f6f8ed;
			--line: #e5e9dd;
			--green: #376b52;
			--coral: #f47d61;
			--month-accent: #e78a55;
			--font-body: "Gowun Dodum", "Malgun Gothic", sans-serif;
			--font-display: "Jua", "Malgun Gothic", sans-serif;
			font-family: var(--font-body);
			color: var(--ink);
			background: var(--paper);
			font-synthesis: none;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-width: 320px;
			min-height: 100vh;
			background-color: var(--paper);
			background-image: radial-gradient(#d9e1d2 0.7px, transparent 0.7px);
			background-size: 18px 18px;
		}
		button, textarea { font: inherit; }
		button { color: inherit; }
		button:focus-visible, textarea:focus-visible { outline: 3px solid #f2a36c; outline-offset: 3px; }

		.app-shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 22px 0 48px; }
		.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 42px; margin-bottom: 20px; }
		.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font: 24px var(--font-display); }
		.brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 10px; background: #d9eb9c; color: #31553b; font-size: 17px; }
		.today-link { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #dce2d5; border-radius: 999px; background: #fffefa; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: background 160ms ease, transform 160ms ease; }
		.today-link:hover { background: #eaf1d7; transform: translateY(-1px); }

		.welcome {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1fr) 245px;
			min-height: 230px;
			align-items: center;
			overflow: hidden;
			border-radius: 8px;
			padding: 30px 44px;
			background-color: #f4c78f;
			background-image: radial-gradient(#fff6d3 1px, transparent 1.3px), linear-gradient(115deg, #f4c78f, #f6d69c 55%, #d9e5a9);
			background-size: 19px 19px, auto;
			animation: arrive 450ms ease-out both;
		}
		.welcome::after { position: absolute; right: 205px; bottom: -75px; width: 200px; height: 140px; border: 1px solid #fff7d2; border-radius: 50%; content: ""; opacity: .65; transform: rotate(-18deg); }
		.welcome-copy { position: relative; z-index: 1; max-width: 640px; }
		.month-kicker { margin: 0 0 10px; color: #506647; font-size: 13px; font-weight: bold; letter-spacing: 0; }
		.welcome h1 { margin: 0; font: clamp(29px, 4vw, 43px)/1.2 var(--font-display); letter-spacing: 0; }
		.cheer { margin: 12px 0 7px; font-size: 16px; line-height: 1.65; }
		.dream { display: inline-flex; align-items: flex-start; gap: 7px; margin: 0; color: #586b50; font-size: 13px; line-height: 1.55; }
		.dream-mark { color: #e56e52; }
		.mascot-stage { position: relative; z-index: 1; display: grid; min-height: 170px; place-items: center; }
		.mascot-halo { position: absolute; width: 155px; aspect-ratio: 1; border: 1px solid #fff8dc; border-radius: 50%; background: #fff9df55; }
		.mascot-image { position: relative; width: 148px; height: 148px; object-fit: contain; filter: drop-shadow(0 10px 6px #80633a28); animation: float 3s ease-in-out infinite; }
		.mascot-fallback { position: relative; font-size: 108px; line-height: 1; filter: drop-shadow(0 10px 6px #80633a28); animation: float 3s ease-in-out infinite; }
		[hidden] { display: none !important; }

		.content-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(285px, .88fr); gap: 22px; margin-top: 22px; align-items: start; }
		.calendar-panel, .day-panel { border: 1px solid #e3e8da; border-radius: 8px; background: #fffefa; }
		.calendar-panel { padding: 23px 25px 20px; }
		.month-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 21px; }
		.month-title { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; row-gap: 2px; }
		.month-title h2 { margin: 0; font: 29px var(--font-display); letter-spacing: 0; }
		.month-title span { color: var(--muted); font-size: 14px; }
		.month-controls { display: flex; align-items: center; gap: 7px; }
		.icon-button { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: #fffefa; font-size: 19px; cursor: pointer; transition: background 150ms ease, border-color 150ms ease; }
		.icon-button:hover { border-color: #bdcba9; background: #edf2df; }
		.weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
		.weekdays { padding-bottom: 10px; color: #8a9589; font-size: 12px; }
		.weekdays span:first-child { color: #dc8068; }
		.calendar-grid { row-gap: 3px; }
		.day-cell { position: relative; display: flex; min-width: 0; min-height: 56px; align-items: center; justify-content: center; flex-direction: column; gap: 3px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; transition: background 140ms ease, color 140ms ease; }
		.day-cell:hover { background: #f0f3e8; }
		.day-number { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 50%; font-size: 14px; }
		.day-cell.is-other-month { color: #bac1b7; }
		.day-cell.is-sunday:not(.is-other-month) .day-number { color: #db8068; }
		.day-cell.is-today .day-number { border: 1px solid var(--month-accent); color: var(--month-accent); font-weight: bold; }
		.day-cell.is-selected .day-number { border: 0; background: var(--green); color: white; }
		.day-cell.is-selected.is-today .day-number { background: var(--month-accent); color: white; }
		.note-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--coral); }
		.calendar-foot { display: flex; align-items: center; gap: 7px; margin: 13px 0 0; color: var(--muted); font-size: 12px; }
		.calendar-foot .note-dot { display: inline-block; }

		.side-column { display: grid; gap: 15px; }
		.day-panel { padding: 21px 21px 19px; }
		.panel-eyebrow { margin: 0 0 5px; color: #849085; font-size: 12px; }
		.selected-date { margin: 0; font: 22px var(--font-display); }
		.note-form { margin-top: 17px; }
		.note-form label { display: block; margin-bottom: 8px; color: #596a5f; font-size: 13px; }
		.note-form textarea { display: block; width: 100%; min-height: 105px; resize: vertical; border: 1px solid #e2e8dc; border-radius: 6px; background: #fbfcf7; padding: 11px 12px; color: var(--ink); font-size: 14px; line-height: 1.6; }
		.note-form textarea::placeholder { color: #a6afa2; }
		.form-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
		.save-status { min-height: 18px; color: #75847a; font-size: 11px; }
		.save-button { min-width: 76px; border: 0; border-radius: 5px; background: var(--green); padding: 9px 14px; color: white; font-size: 13px; cursor: pointer; transition: background 150ms ease; }
		.save-button:hover { background: #284f3b; }

		.quote-strip { display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: center; gap: 11px; border-left: 3px solid #d5e49d; padding: 14px 15px; background: #eff3df; }
		.quote-spark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #dce9b3; color: #627b44; font-size: 18px; }
		.quote-strip p { margin: 0; font-size: 13px; line-height: 1.65; }
		.quote-strip strong { display: block; margin-bottom: 2px; font: 15px var(--font-display); }
		.footer-note { padding-top: 22px; color: #899489; text-align: center; font-size: 11px; }
		.toast { position: fixed; right: 20px; bottom: 20px; z-index: 3; border-radius: 6px; background: #203a32; padding: 11px 16px; color: white; font-size: 13px; box-shadow: 0 6px 22px #203a3230; animation: arrive 180ms ease-out both; }

		@keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
		@media (max-width: 760px) {
			.app-shell { width: min(100% - 28px, 560px); padding-top: 14px; }
			.topbar { margin-bottom: 14px; }
			.welcome { grid-template-columns: minmax(0, 1fr) 115px; min-height: 190px; padding: 24px 20px; }
			.welcome::after { right: 70px; bottom: -90px; }
			.welcome h1 { font-size: 30px; }
			.cheer { max-width: 390px; font-size: 14px; }
			.dream { max-width: 340px; font-size: 12px; }
			.mascot-stage { min-height: 125px; }
			.mascot-halo { width: 108px; }
			.mascot-image { width: 105px; height: 105px; }
			.mascot-fallback { font-size: 78px; }
			.content-grid { grid-template-columns: 1fr; gap: 13px; margin-top: 14px; }
			.calendar-panel { padding: 18px 14px 15px; }
			.month-heading { margin-bottom: 15px; }
			.month-title h2 { font-size: 26px; }
			.day-cell { min-height: 50px; }
			.day-panel { padding: 18px; }
			.quote-strip { order: 2; }
			.footer-note { padding-top: 16px; }
		}
		@media (max-width: 390px) {
			.app-shell { width: calc(100% - 20px); }
			.welcome { grid-template-columns: minmax(0, 1fr) 86px; padding: 20px 15px; }
			.welcome h1 { font-size: 27px; }
			.mascot-halo { width: 82px; }
			.mascot-image { width: 83px; height: 83px; }
			.mascot-fallback { font-size: 63px; }
			.calendar-panel { padding-right: 9px; padding-left: 9px; }
			.day-cell { min-height: 46px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div class="app-shell">
		<header class="topbar">
			<a class="brand" href="#" aria-label="마음달력 홈"><span class="brand-mark" aria-hidden="true">✿</span> 마음달력</a>
			<button class="today-link" id="todayButton" type="button"><span aria-hidden="true">⌖</span> 오늘</button>
		</header>

		<main>
			<section class="welcome" aria-labelledby="welcomeTitle">
				<div class="welcome-copy">
					<p class="month-kicker" id="monthKicker"></p>
					<h1 id="welcomeTitle">오늘도, 너의 속도로.</h1>
					<p class="cheer" id="cheerText" aria-live="polite"></p>
					<p class="dream"><span class="dream-mark" aria-hidden="true">✦</span><span id="dreamText"></span></p>
				</div>
				<div class="mascot-stage" aria-label="이번 달의 응원 캐릭터">
					<span class="mascot-halo" aria-hidden="true"></span>
					<img class="mascot-image" id="mascotImage" src="" alt="">
					<span class="mascot-fallback" id="mascotFallback" hidden aria-hidden="true"></span>
				</div>
			</section>

			<div class="content-grid">
				<section class="calendar-panel" aria-label="달력">
					<div class="month-heading">
						<div class="month-title"><h2 id="calendarMonth"></h2><span id="calendarYear"></span></div>
						<div class="month-controls" aria-label="달력 월 이동">
							<button class="icon-button" id="previousMonth" type="button" aria-label="이전 달">‹</button>
							<button class="icon-button" id="nextMonth" type="button" aria-label="다음 달">›</button>
						</div>
					</div>
					<div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
					<div class="calendar-grid" id="calendarGrid" role="grid" aria-label="날짜 선택"></div>
					<p class="calendar-foot"><span class="note-dot" aria-hidden="true"></span> 마음을 적어둔 날</p>
				</section>

				<aside class="side-column">
					<section class="day-panel" aria-labelledby="selectedDate">
						<p class="panel-eyebrow">나를 위한 작은 기록</p>
						<h2 class="selected-date" id="selectedDate"></h2>
						<form class="note-form" id="noteForm">
							<label for="noteInput">오늘의 마음이나 하고 싶은 일</label>
							<textarea id="noteInput" maxlength="500" placeholder="작은 꿈도 좋아요. 여기에 적어보세요."></textarea>
							<div class="form-footer">
								<span class="save-status" id="saveStatus" aria-live="polite">이 기기에만 저장돼요</span>
								<button class="save-button" type="submit">기록하기</button>
							</div>
						</form>
					</section>
					<section class="quote-strip" aria-live="polite">
						<span class="quote-spark" aria-hidden="true">✦</span>
						<p><strong id="quoteTitle">오늘의 한마디</strong><span id="quoteText"></span></p>
					</section>
				</aside>
			</div>
		</main>
		<footer class="footer-note">서두르지 않아도 괜찮아. 너만의 계절이 오고 있어.</footer>
	</div>
	<div class="toast" id="toast" role="status" hidden></div>

	<script>
		const monthlyMoods = [
			{ name: "토끼", emoji: "🐰", code: "1F430", cheer: "새해의 첫걸음, 작아 보여도 괜찮아. 한 걸음이면 충분해!", dream: "올해 꼭 만나고 싶은 나의 모습을 상상해봐요.", quote: "처음은 누구에게나 서툴러", color: "#d88e55" },
			{ name: "여우", emoji: "🦊", code: "1F98A", cheer: "네 안의 반짝임은 생각보다 훨씬 커. 오늘도 마음껏 빛나자!", dream: "마음이 따뜻해지는 순간을 하나 만들어봐요.", quote: "다정함은 가장 용감한 힘", color: "#df795e" },
			{ name: "강아지", emoji: "🐶", code: "1F436", cheer: "실수해도 다시 꼬리를 흔들면 돼. 너는 잘하고 있어!", dream: "올봄 새롭게 도전하고 싶은 일을 적어봐요.", quote: "다시 시작하는 힘도 네 안에 있어", color: "#71a66c" },
			{ name: "고양이", emoji: "🐱", code: "1F431", cheer: "잠깐 쉬어가도 괜찮아. 네 페이스가 가장 멋진 속도야!", dream: "아무 걱정 없이 쉬는 하루를 그려봐요.", quote: "쉼도 앞으로 가는 시간", color: "#d788a1" },
			{ name: "고래", emoji: "🐳", code: "1F433", cheer: "큰 꿈도 좋아. 너라면 깊은 바다 끝까지 닿을 수 있어!", dream: "언젠가 꼭 가보고 싶은 곳을 떠올려봐요.", quote: "꿈은 클수록 멀리 데려가", color: "#5a9bc0" },
			{ name: "곰", emoji: "🐻", code: "1F43B", cheer: "네가 쌓아온 하루들이 멋진 내일을 만들고 있어!", dream: "올해의 절반, 여기까지 온 나를 칭찬해봐요.", quote: "꾸준함은 조용한 용기", color: "#9b8a65" },
			{ name: "사자", emoji: "🦁", code: "1F981", cheer: "네 목소리로 꿈을 말해봐. 세상에 알려도 괜찮아!", dream: "사람들 앞에서 당당히 해내고 싶은 일을 적어봐요.", quote: "네가 믿는 만큼 자라날 거야", color: "#d8a744" },
			{ name: "펭귄", emoji: "🐧", code: "1F427", cheer: "조금 느려도 앞으로 가고 있다면 그걸로 충분해!", dream: "가을에 꼭 이루고 싶은 작은 목표를 정해봐요.", quote: "느린 걸음도 분명한 전진", color: "#57938c" },
			{ name: "고릴라", emoji: "🦍", code: "1F98D", cheer: "네 안의 단단한 힘을 믿어. 생각보다 더 멀리 갈 수 있어!", dream: "끝까지 해내고 싶은 나만의 프로젝트를 떠올려봐요.", quote: "너는 이미 많은 걸 해냈어", color: "#a47769" },
			{ name: "부엉이", emoji: "🦉", code: "1F989", cheer: "오늘 배운 작은 것 하나가 내일의 너를 더 크게 만들어!", dream: "새롭게 배우고 싶은 것을 하나 골라봐요.", quote: "호기심은 멋진 나침반", color: "#9a83ad" },
			{ name: "사슴", emoji: "🦌", code: "1F98C", cheer: "차가운 날에도 너의 따뜻한 마음은 길을 밝혀줄 거야!", dream: "고마운 사람에게 전하고 싶은 말을 생각해봐요.", quote: "따뜻한 마음은 오래 남아", color: "#c47e58" },
			{ name: "판다", emoji: "🐼", code: "1F43C", cheer: "한 해의 끝에도 새로운 꿈은 피어나. 내일도 같이 가자!", dream: "올해의 나에게 꼭 해주고 싶은 말을 적어봐요.", quote: "너의 다음 장도 기대할게", color: "#638f77" }
		];
		const today = new Date();
		let shownYear = today.getFullYear();
		let shownMonth = today.getMonth();
		let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
		let notes = readNotes();
		let toastTimeout;

		function readNotes() {
			try {
				const saved = JSON.parse(localStorage.getItem("maeum-calendar-notes") || "{}");
				return saved && typeof saved === "object" ? saved : {};
			} catch {
				return {};
			}
		}

		function dateKey(date) {
			return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
		}

		function updateMood() {
			const mood = monthlyMoods[shownMonth];
			document.documentElement.style.setProperty("--month-accent", mood.color);
			document.getElementById("monthKicker").textContent = `${shownMonth + 1}월의 응원 친구 · ${mood.name}`;
			document.getElementById("cheerText").textContent = mood.cheer;
			document.getElementById("dreamText").textContent = mood.dream;
			document.getElementById("quoteTitle").textContent = `${mood.name}의 한마디`;
			document.getElementById("quoteText").textContent = mood.quote;
			const image = document.getElementById("mascotImage");
			const fallback = document.getElementById("mascotFallback");
			image.hidden = false;
			fallback.hidden = true;
			fallback.textContent = mood.emoji;
			image.alt = `${shownMonth + 1}월의 응원 캐릭터 ${mood.name}`;
			image.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${mood.code.toLowerCase()}/512.webp`;
		}

		function renderCalendar() {
			const monthName = `${shownMonth + 1}월`;
			document.getElementById("calendarMonth").textContent = monthName;
			document.getElementById("calendarYear").textContent = `${shownYear}년`;
			const grid = document.getElementById("calendarGrid");
			const firstDay = new Date(shownYear, shownMonth, 1);
			const start = new Date(shownYear, shownMonth, 1 - firstDay.getDay());
			const todayKey = dateKey(today);
			const selectedKey = dateKey(selectedDate);
			grid.replaceChildren();

			for (let index = 0; index < 42; index += 1) {
				const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + index);
				const key = dateKey(date);
				const button = document.createElement("button");
				button.type = "button";
				button.className = "day-cell";
				button.setAttribute("role", "gridcell");
				button.setAttribute("aria-label", `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일${notes[key] ? ", 기록 있음" : ""}`);
				if (date.getMonth() !== shownMonth) button.classList.add("is-other-month");
				if (date.getDay() === 0) button.classList.add("is-sunday");
				if (key === todayKey) button.classList.add("is-today");
				if (key === selectedKey) button.classList.add("is-selected");

				const number = document.createElement("span");
				number.className = "day-number";
				number.textContent = date.getDate();
				button.append(number);
				if (notes[key]) {
					const dot = document.createElement("span");
					dot.className = "note-dot";
					dot.setAttribute("aria-hidden", "true");
					button.append(dot);
				}
				button.addEventListener("click", () => {
					selectedDate = date;
					if (date.getMonth() !== shownMonth || date.getFullYear() !== shownYear) {
						shownMonth = date.getMonth();
						shownYear = date.getFullYear();
						updateMood();
					}
					renderCalendar();
					renderSelectedDate();
				});
				grid.append(button);
			}
		}

		function renderSelectedDate() {
			const key = dateKey(selectedDate);
			const weekdays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
			document.getElementById("selectedDate").textContent = `${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일 ${weekdays[selectedDate.getDay()]}`;
			document.getElementById("noteInput").value = notes[key] || "";
			document.getElementById("saveStatus").textContent = notes[key] ? "기록이 저장되어 있어요" : "이 기기에만 저장돼요";
		}

		function showToast(message) {
			const toast = document.getElementById("toast");
			toast.textContent = message;
			toast.hidden = false;
			window.clearTimeout(toastTimeout);
			toastTimeout = window.setTimeout(() => { toast.hidden = true; }, 2200);
		}

		document.getElementById("previousMonth").addEventListener("click", () => {
			shownMonth -= 1;
			if (shownMonth < 0) { shownMonth = 11; shownYear -= 1; }
			selectedDate = new Date(shownYear, shownMonth, 1);
			updateMood();
			renderCalendar();
			renderSelectedDate();
		});
		document.getElementById("nextMonth").addEventListener("click", () => {
			shownMonth += 1;
			if (shownMonth > 11) { shownMonth = 0; shownYear += 1; }
			selectedDate = new Date(shownYear, shownMonth, 1);
			updateMood();
			renderCalendar();
			renderSelectedDate();
		});
		document.getElementById("todayButton").addEventListener("click", () => {
			shownYear = today.getFullYear();
			shownMonth = today.getMonth();
			selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
			updateMood();
			renderCalendar();
			renderSelectedDate();
		});
		document.getElementById("noteForm").addEventListener("submit", (event) => {
			event.preventDefault();
			const key = dateKey(selectedDate);
			const value = document.getElementById("noteInput").value.trim();
			if (value) notes[key] = value;
			else delete notes[key];
			try {
				localStorage.setItem("maeum-calendar-notes", JSON.stringify(notes));
				document.getElementById("saveStatus").textContent = value ? "기록이 저장되어 있어요" : "기록을 비웠어요";
				renderCalendar();
				showToast(value ? "오늘의 마음을 기록했어요" : "기록을 비웠어요");
			} catch {
				showToast("저장할 수 없어요. 브라우저 설정을 확인해주세요.");
			}
		});
		document.getElementById("mascotImage").addEventListener("error", () => {
			document.getElementById("mascotImage").hidden = true;
			document.getElementById("mascotFallback").hidden = false;
		});

		updateMood();
		renderCalendar();
		renderSelectedDate();
	</script>
</body>
</html>
